    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Persönliches, nicht-kommerzielles Portfolio-Projekt: eigene Webanwendungen mit TypeScript, Vue.js/Nuxt und React/Next.js."
    />
    <meta
      name="twitter:image"
      content="https://portfolio.savasbuilds.com/assets/sumi.png"
    />
  </head>
  <body>
    <script>
      // Applied before paint so a saved theme never flashes the other one.
      // Light is the default; must match getInitialTheme() in src/theme.tsx.
      (function () {
        try {
          var theme =
            localStorage.getItem("portfolio-theme") === "dark"
              ? "dark"
              : "light";
          if (theme === "light") {
            document.documentElement.classList.add("light");
          }
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "light" ? "#f5e6e8" : "#0d1b2a"
            );
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
